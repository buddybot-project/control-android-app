image: registry.gitlab.com/buddybot3/control/android-app-builder:latest

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=true"

stages:
  - build
  - test
  - analyze

# 🧱 Адаптивный билд: debug для всех, release — только для master
build:
  stage: build
  script:
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "master" || "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "master" ]]; then
        echo "Building release..."
        ./gradlew assembleRelease
      else
        echo "Building debug..."
        ./gradlew assembleDebug
      fi
  only:
    - merge_requests
    - main
    - develop
    - master

test:
  stage: test
  script:
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "master" || "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "master" ]]; then
        echo "Running release tests and lint..."
        ./gradlew testReleaseUnitTest lintRelease
        export BUILD_TYPE="release"
      else
        echo "Running debug tests and lint..."
        ./gradlew testDebugUnitTest lintDebug
        export BUILD_TYPE="debug"
      fi
  after_script:
    - mkdir -p artifacts
    - |
      if [[ "$BUILD_TYPE" == "release" ]]; then
        cp app/build/test-results/testReleaseUnitTest/TEST-*.xml artifacts/ || true
        cp app/build/reports/lint-results-release.sarif artifacts/ || true
        cp app/build/reports/lint-results-release.html artifacts/ || true
      else
        cp app/build/test-results/testDebugUnitTest/TEST-*.xml artifacts/ || true
        cp app/build/reports/lint-results-debug.sarif artifacts/ || true
        cp app/build/reports/lint-results-debug.html artifacts/ || true
      fi
  artifacts:
    when: always
    paths:
      - artifacts/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop
    - master

sonarcloud-analysis:
  stage: analyze
  script:
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "master" || "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" == "master" ]]; then
        export BUILD_TYPE="release"
      else
        export BUILD_TYPE="debug"
      fi

      export SONAR_SOURCES="app/src/main/java"
      export SONAR_TESTS="app/src/test/java"
      export SONAR_BINARIES="app/build/tmp/kotlin-classes/$BUILD_TYPE,app/build/intermediates/compile_app_classes_jar/$BUILD_TYPE"

      sonar-scanner \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.organization=$SONAR_ORGANIZATION \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.sources=$SONAR_SOURCES \
        -Dsonar.tests=$SONAR_TESTS \
        -Dsonar.java.binaries=$SONAR_BINARIES \
        -Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID \
        -Dsonar.pullrequest.branch=$CI_COMMIT_REF_NAME \
        -Dsonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  only:
    - merge_requests
    - main
    - develop
    - master
